<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* #all:hover{
            rotate: 40deg;
        } */
        #eye{
            height: 400px;
            width: 400px;
            background-color: gold;
            border-radius: 50%;
            margin-top: 150px;
            margin-left: 500px;
        }
        #outereye{
            position: relative;
            top: 50px;
            justify-content: space-around;
            display: flex;
            height: 80px;
            width: 400px;
            
        }
        #leye{
            background-color: aliceblue;
            height:90px;
            width:70px;
            border:1px solid;
            border-radius: 50%;

        }
        #reye{
            background-color: aliceblue;
            height:90px;
            width:70px;
            border:1px solid; 
            border-radius: 50%;

        }
        #eyeball{
            animation: eyeball;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            top: 25px;
            justify-content: space-around;
            text-align: center;
            height: 50px;
            width: 30px;
            position: absolute;
            border: 1px solid;
            border-radius: 50%;
            background-color: black;
        }
        @keyframes eyeball{
            20%,30%,40%{
                transform: translate(0px,-20px);
                background-color: crimson;
            }
            50%,60%,70%{
                background-color:darkcyan;
            }
        }
        #mouth{
            animation: mouth;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            text-align: center;
            left:150px;
            height:120px;
            width:100px;
            border:1px solid;
            position: relative;
            top: 160px;
            border-radius: 50%;
            background-color: rgb(65, 43, 43);

        
        }
        @keyframes mouth{
            20%,30%,40%{
                border-radius: 15%;
            }
            50%,60%,70%{
                border-radius: 30%;
            }
        }
        #toung{
            animation: toung;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            position: relative;
            height:40px;
            width:80px;
            border: 1px solid;
            top:70px;
            left:10px;
            border-radius: 50%;
            background-color: beige;
        
        }
        @keyframes toung{
            20%,30%,40%{
                transform: translate(0px,-15px);
            }
            /* 50%,60%,70%{
                border-radius: 30%;
            } */
        }
    </style>
</head>
<body>
    <div id="all">
    <div id="eye">

        <div id="outereye">

        <div id="leye">

            <div id="eyeball"></div>
        </div>

        <div id="reye">
            <div id="eyeball"></div>

        </div>
            </div>
            <div id="mouth">
                <div id="toung"></div>
            </div>
    </div>
    </div>
</body>
</html>
