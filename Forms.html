<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>
    <form style="width: 40%;background-color: #2c726f;color: aliceblue; ">
        <fieldset>

            <legend style="background-color: rgb(0, 0, 0); color: aliceblue;">LOGIN FORM</legend><br>
            <label for=" username">Enter The UserName:-</label>
            <input type="text" id="username" placeholder="Enter UserName" required><br><br>

            <label for="password">Enter Mobile Number:-</label>
            <input type="tel" placeholder="Enter Mobile Number" required><br><br>

            <label for="password">Enter Strong Password:-</label>
            <input type="password" id="password" placeholder="Enter Password" required><br><br>

            

          

            <button style="background-color: crimson;color: aliceblue;">Login</button>
        </fieldset>
    </form>
    
</body>
</html>
