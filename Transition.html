<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #transition{
            height: 250px;
            width: 250px;
            background:linear-gradient(rgb(255, 249, 79),rgb(247, 0, 0)) ;
            margin-top:230px;
            margin-left: 600px;
            transition-property: width,border,height,background-color;
            transition-delay: 2s;
            transition-duration: 3s;
            transition-timing-function: ease-in;
            border-radius: 20%;
        }
        #transition:hover{
            width:500px;
            height: 100px;
            border:10px solid black;
            background-color: bisque;
            background-color: rgb(217, 23, 23);

        }
        
    </style>
</head>
<body>
    <div id="transition">


    </div>
</body>
</html>
