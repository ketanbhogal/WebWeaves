<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <form>
        <fieldset style="width: 50%;">
            <legend><b>Feedback Form</b></legend><br>


            <label for="Search">Search</label>
            <input type="search" id="Search"><br><br>

            <label for="username">Enter Your Name:</label>
            <input type="text" id="username" placeholder="Enter Name"><br><br>

            <label for="mobile">Enter Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Enter Mobile Number"><br><br>

            <label for="address">Enter Your Address:</label>
            <input type="text" id="address" placeholder="Enter Address"><br><br>

            <label for="email">Enter Your Email:</label>
            <input type="email" id="email" placeholder="Enter Email"><br><br>

            <label for="date">Enter Your Birth Date And Time:</label>
            <input type="datetime-local" id="date" placeholder="Date of Birth"><br><br>

            <label for="city">Select Your City: </label>
            <select id="city">
                <option value="mumbai">Mumbai</option>
                <option value="pune">Pune</option>
                <option value="Aahilyanagar">Aahilyanagar</option>
                <option value="nagpur">Nagpur</option>
                <option value="delhi">Delhi</option>
                <option value="hydrabad">Hydrabad</option>
                <option value="gurjat">Gurjat</option>
                <option value="rajastan">Rajastan</option>
                <option value="kolhapur">Kolhapur</option>
                <option value="alibag">Alibag</option>
            </select>
            <hr>

            <label for="gender">Select Your Gender:</label><br><br>
            <input type="radio" id="male" name="gender">Male<br>
            <input type="radio" id="female" name="gender">Female<br>
            <input type="radio" id="other" name="gender">Other<br><br>
            <hr>

            <label for="language">Select Cources</label><br><br>
            <input type="checkbox" id="C">C<br>
            <input type="checkbox" id="C++">C++<br>
            <input type="checkbox" id="Python">Python<br>
            <input type="checkbox" id="Java">Java<br>
            <input type="checkbox" id="HTML">HTML<br>
            <input type="checkbox" id="CSS">CSS<br>
            <input type="checkbox" id="Bootstrap">Bootstrap<br>
            <input type="checkbox" id="JavaScript">JavaScript<br>
            <input type="checkbox" id="SQL">SQL<br><br>
            <hr>

            <button>Submit</button>

        </fieldset>
    </form>
</body>
</html>
