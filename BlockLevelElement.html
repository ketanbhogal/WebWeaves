<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block level element</title>
</head>
<body>
        <!-- below element are the block level element this gives full width of container -->

    <h1>Hii From H1</h1>
    <h2>Hii From H2</h2>
    <p>hiiii</p>
    <p>hiiii</p>

        <!-- below element are the inline level element this gives require width of container -->

    <a>hbuhbfviv</a>
    <a>iufhvfrruvbivu</a>
    <input type="text">
    <input type="text">

            <!-- below element are the inline block level element we can handle its width and height as per requrement -->


    <img src="music.jpg" height="200px" width="200px" alt="music image">

    


    
</body>
</html>
