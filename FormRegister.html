<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <style>
        .form_container{
      
        } 
    </style>
</head>
<body>
    <section class="form_container">
    <form style="width: 60%; background-color: rgb(137, 170, 159) ;color: rgb(0, 0, 0);border:10px;" >
        <fieldset>

            <legend><b><i>Register Form</i></b></legend><br>

            <fieldset>
            <div class="name_container">
            <label for="username">Enter First Name:</label>
            <input type="text" id="username" placeholder="Enter First Name">
            <label for="username">Enter Last Name:</label>
            <input type="text" id="username" placeholder="Enter Last Name"><br><br>
                </div>
        </fieldset>

            <fieldset>
                <div class="email_Container">
            <label for="mobile">Enter Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Enter Mobile Number"><br><br>

            <label for="address">Enter Your Address:</label>
            <input type="text" id="address" placeholder="Enter Address"><br><br>

            <label for="email">Enter Your Email:</label>
            <input type="email" id="email" placeholder="Enter Email"><br><br>

            <label for="password">Enter Strong Password:</label>
            <input type="password" id="password" placeholder="Enter Password">
            </div>
            </fieldset>

            <fieldset>
                <div class="gender">
            <label for="gender">Select Your Gender:</label><br><br>
            <input type="radio" id="male" name="gender">Male<br>
            <input type="radio" id="female" name="gender">Female<br>
            <input type="radio" id="other" name="gender">Other<br><br>
    

            <label for="date">Choose Birth Date:</label>
            <input type="date" id="date" placeholder="Date of Birth">
        </div>
    </fieldset>


            <fieldset>
                <div class="Sign_up">                
            <button style="background-color: rgb(207, 18, 18); color: aliceblue;">Sign Up</button>
            </div>
            </fieldset>
        </fieldset>
    </form>
    </section>
</body>
</html>
