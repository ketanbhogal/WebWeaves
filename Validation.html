<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation</title>
</head>
<body>
    <fieldset>
        <legend>Mobile Number Validation</legend>
        <br>
        <form action="" method="get()">
            <label for="phoneNumber">Phone Number : </label>
            <input type="tel" name="phone" id="phoneNumber" size="11" pattern="[6-9]{1}[0-9]{9}" required>
            <br><br>
            <input type="submit" name="Submit">

        </form>
    </fieldset>
    
</body>
</html>
