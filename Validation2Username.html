<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Username Validation</legend>
        <br>
        <form action="" method="get">
            <label for="username"> UserName: </label>
            <input type="text" name="un" id="Username" size="11" pattern="[A-Z,a-z,0-9]{5,15}" required>
            <br><br>
            <input type="submit" value="Submit">

        </form>
    </fieldset>
</body>
</html>
