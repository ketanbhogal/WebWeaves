<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            
            background-image: url("https://img.freepik.com/free-vector/hand-painted-watercolor-pastel-sky-background_23-2148902771.jpg?size=626&ext=jpg&ga=GA1.1.1546980028.1719619200&semt=sph");
            background-size: 1450px;
            margin: 23%;
            border: 1px dotted rgb(170, 43, 96);
            padding:3%;
            

        }
        p::first-letter{
            color: darkred;
            font-size: 40px;
            text-transform: uppercase;

        }
        p::before{
           content: "Good Thought:  ";
        }
        p::after{
            content:" \. Have A Nice Day.";
        }
        p::first-line{
            color: rgb(64, 133, 110);
        }

        p::selection{
            background-color: black;
            color:white;
        }
        p{
            text-shadow: 200px;
        }
    
    </style>
</head>
<body>
    <p >“Failure is simply the opportunity to begin again, this time more intelligently.”</p>
    <p>“Our greatest glory is not  in never falling , but  in rising every  time we fall.” </p>

    
</body>
</html>
